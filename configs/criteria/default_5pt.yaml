name: default_5pt
description: "General-purpose criteria for instruction-following evaluation (1-5 scale)."
criteria:
  - name: adherence
    scale_min: 1
    scale_max: 5
    description: >-
      Follows the user's instructions and constraints precisely: required format, scope,
      style constraints, and any do/don't requirements. Penalize missing requested parts
      or deviating from constraints.
    score_references:
      5: "Fully follows the user's instructions and constraints, including format and scope."
      4: "Mostly follows the request but misses some details or adds minor unnecessary content."
      3: "Follows only part of the request and misses important constraints or requested parts."
      2: "Partially attempts the request but deviates significantly from the instructions."
      1: "Does not follow the user's request in any meaningful way."

  - name: helpfulness
    scale_min: 1
    scale_max: 5
    description: >-
      Advances the user's goal with relevant, actionable content. Provides useful steps,
      options, or explanations tailored to the request. Penalize generic filler or
      non-responsive content.
    score_references:
      5: "Directly solves the user's problem with highly useful, actionable, and relevant content."
      4: "Generally helpful and relevant, but misses some useful detail or optimization."
      3: "Partially helpful but vague, generic, or missing key actionable guidance."
      2: "Minimally helpful; mostly generic content that barely addresses the user's need."
      1: "Unhelpful or non-responsive to the user's goal."

  - name: factuality
    scale_min: 1
    scale_max: 5
    description: >-
      Information is correct and appropriately qualified. Avoids hallucinations and
      unwarranted specifics. If uncertain, expresses uncertainty and does not fabricate
      sources, citations, or details.
    score_references:
      5: "Accurate and well-qualified throughout, with no fabricated or unsupported claims."
      4: "Mostly accurate, with only minor imprecision or insufficient qualification."
      3: "Contains some factual errors or overclaims but core information is correct."
      2: "Contains multiple factual errors, overclaims, or likely hallucinated details."
      1: "Largely incorrect, fabricated, or misleading."

  - name: completeness
    scale_min: 1
    scale_max: 5
    description: >-
      Covers the key aspects of the request without major omissions. Addresses all
      sub-questions and important constraints. Penalize partial answers or skipped items.
    score_references:
      5: "Covers all major parts of the request with no important omissions."
      4: "Covers the main request but misses some secondary details or sub-parts."
      3: "Only partially addresses the request; some important pieces are missing."
      2: "Addresses only a small fraction of what was asked."
      1: "Fails to address the requested task in a complete or usable way."

  - name: clarity
    scale_min: 1
    scale_max: 5
    description: >-
      Well-organized, easy to follow, and unambiguous. Uses logical structure, headings/lists
      when helpful, and clear references. Penalize confusing organization or ambiguity.
    score_references:
      5: "Clear, logically structured, and easy to follow with no ambiguity."
      4: "Mostly clear and organized, but has a few awkward transitions or ambiguities."
      3: "Noticeably hard to follow due to weak structure or unclear phrasing."
      2: "Confusing and poorly organized in several places."
      1: "Confusing, disorganized, or difficult to understand."

  - name: fluency
    scale_min: 1
    scale_max: 5
    description: >-
      Language and presentation quality: fluent, readable, appropriately concise, and
      well-formatted. Tone is appropriate for the user/context.
    score_references:
      5: "Fluent, natural, polished language with strong readability and appropriate tone."
      4: "Generally fluent and readable, with some awkward phrasing or minor disfluencies."
      3: "Frequent disfluencies or formatting issues that make reading noticeably harder."
      2: "Poor language quality with many errors that impair understanding."
      1: "Severely disfluent or poorly formatted to the point of harming comprehension."
