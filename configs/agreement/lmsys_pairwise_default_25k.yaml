# Reusable agreement config for LMSYS pairwise judging.
# Use CLI overrides like --judge_model / --judge_gpus when trying a different judge.

dataset: lmsys
n_instructions: 25000
seed: 42
balance_by: models
criteria: default
output_dir: results/agreement_test_container

generation:
  ignore_score_cache: true

criteria: default
judge:
  model: VLLM/google/gemma-4-26B-A4B-it 
  gpus: 4
  mode: pairwise
  max_model_len: 32768
  enforce_eager: true
