[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-judge-eval"
version = "0.2.0a0"
description = "Open source LLM evaluation with swappable judges, rubrics, and arena ratings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.0.0",
    "fast-langdetect>=1.0.0",
    "huggingface-hub>=0.34.4",
    "ipython>=9.5.0",
    "joblib>=1.5.2",
    "jupyter>=1.1.1",
    "langchain>=0.3.27",
    "langchain-community>=0.3.29",
    "langchain-openai>=0.3.32",
    "langchain-together>=0.3.1",
    "matplotlib>=3.10.6",
    "numpy>=1.26.0",
    "pandas>=2.3.2",
    "pydantic>=2.8.0",
    "rich>=14.1.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "slurmpilot @ git+https://github.com/geoalgo/slurmpilot.git@main",
    "tqdm>=4.67.1",
]

[tool.setuptools.packages.find]
include = ["openjury*"]
exclude = ["slurmpilot_scripts*"]

[project.optional-dependencies]
vllm = ["vllm==0.10.2", "transformers>=4.55.2,<5"]
llamacpp = ["llama-cpp-python>=0.3.0"]
yaml = ["PyYAML>=6.0"]
dev = ["black>=25.1.0", "pytest>=8.4.2"]

[project.scripts]
openjury-arena = "openjury.cli.arena:main"
openjury-generate = "openjury.cli.generate:main"
openjury-completion-cache = "openjury.cache.completions:_cli"
openjury-score-cache = "openjury.cache.scores:_cli"

[tool.setuptools.package-data]
openjury = ["prompts/*.txt"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
